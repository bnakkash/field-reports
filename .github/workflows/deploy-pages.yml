# .github/workflows/deploy-pages.yml
#
# Builds the Vite app and publishes it to GitHub Pages.
# Set the endpoint once in the repo: Settings → Secrets and variables →
# Actions → Variables → New repository variable
#     VITE_STRUCTURE_ENDPOINT = https://itxcaamyiilvotfzctit.supabase.co/functions/v1/structure-report
#
# It is a *variable*, not a secret — it is a public URL and it needs to be
# readable at build time. Nothing secret ever enters this workflow.

name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        env:
          VITE_STRUCTURE_ENDPOINT: ${{ vars.VITE_STRUCTURE_ENDPOINT }}
        run: npm run build

      # Pages serves a project site from /<repo>/ — vite.config.js must set
      # `base: '/<repo>/'` to match, or every asset 404s and the service
      # worker never registers.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
